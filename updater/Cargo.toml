[package]
name = "eer_updater"
version = "0.1.0"
edition = "2024"
authors = ["jiubook <jiubook@vip.qq.com>"]
description = "针对终末地基质妙妙小工具的Rust版updater"
license = "AGPL-3.0-or-later"
repository = "https://github.com/jiubook/EER-Ai"
readme = "HOT_UPDATE_GUIDE.md"
keywords = ["endfield", "recognizer", "updater"]
categories = ["command-line-utilities"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
