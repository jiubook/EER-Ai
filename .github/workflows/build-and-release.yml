name: Build with PyInstaller and Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-and-release:
    permissions:
      contents: write

    strategy:
      matrix:
        os: [windows]

    runs-on: ${{ matrix.os }}-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Set up node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Build frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

      - name: Set up Python
        uses: actions/setup-python@v6
        # 使用 .python-version 文件中指定的 Python 版本

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: |
          uv sync --no-dev --group build

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Lint updater (clippy + fmt check)
        run: |
          cargo clippy --release --manifest-path updater/Cargo.toml -- -D warnings
          cargo fmt --manifest-path updater/Cargo.toml --check

      - name: Build updater
        run: cargo build --release --manifest-path updater/Cargo.toml

      - name: Build with PyInstaller
        run: |
          uv run --no-dev --group build pyinstaller main.spec

      - name: Copy updater to dist
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "dist/endfield-essence-recognizer/_internal" | Out-Null
          Copy-Item "updater/target/release/eer_updater.exe" "dist/endfield-essence-recognizer/_internal/eer_updater.exe"

      - name: Generate update manifest
        run: |
          uv run python scripts/generate_manifest.py --dist-dir dist/endfield-essence-recognizer

      - name: Zip the built files
        shell: pwsh
        run: |
          cd dist
          Compress-Archive -Path "endfield-essence-recognizer/*" -DestinationPath "endfield-essence-recognizer-${{ github.ref_name }}-${{ matrix.os }}.zip"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/endfield-essence-recognizer-${{ github.ref_name }}-${{ matrix.os }}.zip
          generate_release_notes: true
